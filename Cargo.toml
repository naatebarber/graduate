[package]
name = "graduate"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/naatebarber/graduate"
homepage = "https://github.com/naatebarber/graduate"
license = "MIT OR Apache-2.0"
description = "Small autograd framework"
readme = "README.md"

[dependencies]
ndarray = { version = "0.17.2", features = ["serde"] }
ndarray-rand = "0.16.0"
ndarray-stats = "0.7.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde-binary = "0.5.0"
bincode = "1.3.3"

[features]
blas = ["ndarray/blas"]

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.14", features = ["accelerate"] }

